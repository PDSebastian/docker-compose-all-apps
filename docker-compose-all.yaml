services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_all_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  school:
    image: sebi123q/sebi-school-app:2.0
    container_name: school
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  cars:
    image: sebi123q/cars-app:1.0
    container_name: cars
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:mysql://mysql:3306/cars_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  sebi-online-shop:
    image: sebi123q/sebi-online-shop-app:1.0
    container_name: sebi-online-shop-app
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:mysql://mysql:3306/online_shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  boats-users:
    image: sebi123q/boats-users-app:1.0
    container_name: boats-users-app
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      DB_URL: jdbc:mysql://mysql:3306/boats_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  solarsyncbroker:
    image: sebi123q/solarsyncbroker-app:2.0
    container_name: solarsyncbroker-app
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      DB_URL: jdbc:mysql://mysql:3306/solar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "dev-only-solarsync-secret-key-please-change-in-prod-0123456789ABCDEF"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_all_data:
